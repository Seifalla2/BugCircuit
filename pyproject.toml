[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugcircuit"
version = "0.4.0"
description = "Evidence-first diagnostics for browser, API, and authentication failures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BugCircuit contributors"}]
keywords = ["debugging", "diagnostics", "playwright", "har", "oauth", "api", "qa"]
classifiers = [
 "Development Status :: 3 - Alpha",
 "Environment :: Console",
 "Intended Audience :: Developers",
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Programming Language :: Python :: 3.13",
 "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[project.scripts]
bugcircuit = "bugcircuit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
bugcircuit = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
