name: Initialize verified source
on:
  push:
    paths:
      - '.bootstrap/part-*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bugcircuit-bootstrap
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/bugcircuit-source.tar.gz
          echo "1ac3464cc58c5cadd49f59cb390b9a6bdf1bde1ff813d10fcb2f53b7bf9eb32e  /tmp/bugcircuit-source.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import pathlib
          import tarfile
          archive = pathlib.Path('/tmp/bugcircuit-source.tar.gz')
          with tarfile.open(archive, 'r:gz') as files:
              for member in files.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if member.name.startswith('/') or '..' in path.parts or not member.isfile():
                      raise RuntimeError('Unsafe member in source archive')
              files.extractall('.', filter='data')
          PY
          rm -rf .bootstrap
      - name: Commit source to the private main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import BugCircuit v0.2 verified source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run package tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
